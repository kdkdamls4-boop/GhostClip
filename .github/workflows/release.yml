name: GhostClip Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Run unit tests (ghostclip)
        run: python run_tests.py

      - name: Run unit tests (explained twin)
        run: |
          python -c "import sys, unittest; sys.path.insert(0, 'explained'); suite = unittest.defaultTestLoader.discover('tests', pattern='test_*.py'); result = unittest.TextTestRunner(verbosity=2).run(suite); sys.exit(0 if result.wasSuccessful() else 1)"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build GhostClip.exe
        run: pyinstaller --clean --noconfirm ghostclip.spec

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path dist/GhostClip.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  GhostClip.exe" | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/GhostClip.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ### 👻 GhostClip Shield

            Автономный защитник буфера обмена для Windows 10/11 (**0 внешних зависимостей**).

            #### Быстрый старт
            1. Скачайте `GhostClip.exe` и `SHA256SUMS.txt`.
            2. Проверьте контрольную сумму в PowerShell:
               ```powershell
               Get-FileHash .\GhostClip.exe -Algorithm SHA256
               ```
            3. Запустите `GhostClip.exe` (при первом запуске SmartScreen может попросить нажать «Подробнее → Выполнить в любом случае» — см. `SECURITY.md`).

            Подробный список изменений: `CHANGELOG.md` · Безопасность и модель угроз: `SECURITY.md`.
