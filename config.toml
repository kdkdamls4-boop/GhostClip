# ==============================================================================
#                      GhostClip Shield (GCB) Configuration
# ==============================================================================

[general]
# Время жизни обнаруженного секрета в секундах до самоуничтожения (по умолчанию 45 сек)
secret_ttl_seconds = 45

# Автоматически удалять трекинг-метки из ссылок (utm_*, fbclid, gclid, si= и др.)
clean_urls = true

# Удалять невидимые zero-width символы (используются для скрытого трекинга текста)
clean_zero_width = true

[detector]
# Порог энтропии Шеннона (случайности символов). Для паролей обычно от 3.5 до 4.5
entropy_threshold = 3.8

# Минимальная длина строки для проверки на энтропию
entropy_min_length = 12

# Проверять номера банковских карт (алгоритм Луна)
check_credit_cards = true

# Проверять известные шаблоны API-токенов (GitHub, OpenAI, AWS, JWT, SSH ключи)
check_api_keys = true

[firewall]
# Включить интерактивный файрвол для отслеживания читающих процессов
enabled = true

# Зеленый коридор: если пользователь САМ нажал Ctrl+V в активном окне,
# доступ дается автоматически на 500 мс без вызова всплывающего окна
intent_aware_bypass = true

# Время ожидания решения пользователя в секундах перед авто-отказом
dialog_timeout_seconds = 7

# Honeypot: при отказе отдавать безопасную пустышку, чтобы шпион не понял блокировку
use_honeypot = true

# Белый список приложений (разрешено читать буфер без уведомлений)
whitelist = [
    "devenv.exe",
    "code.exe",
    "notepad.exe",
    "keepassxc.exe",
    "keepass.exe",
    "1password.exe",
    "bitwarden.exe"
]

# Черный список приложений (всегда блокировать)
blacklist = []

[panic]
# Блокировать Windows (Win+L) при срабатывании PanicFlush (Ctrl+Shift+Alt+P)
# По умолчанию false (мягкий режим: затирка буфера и Win+V без блокировки экрана)
lock_workstation = false
