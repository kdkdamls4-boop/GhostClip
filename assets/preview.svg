<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480" role="img" aria-label="Превью интерфейса GhostClip Shield v0.3.0">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Фон -->
  <rect width="860" height="480" rx="14" fill="url(#bgGrad)"/>

  <!-- Окно терминала Windows -->
  <g filter="url(#cardShadow)">
    <rect x="24" y="20" width="690" height="420" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <!-- Заголовок окна -->
    <rect x="24" y="20" width="690" height="34" rx="10" fill="#1E293B"/>
    <rect x="24" y="42" width="690" height="12" fill="#1E293B"/>
    <circle cx="44" cy="37" r="5" fill="#475569"/>
    <text x="58" y="41" fill="#E2E8F0" font-family="'Segoe UI', Consolas, monospace" font-size="12.5" font-weight="600">
      GhostClip Shield v0.3.0 (Консоль + Трей)
    </text>
    <!-- Кнопки управления окном (свернуть, [X] отключён) -->
    <text x="646" y="41" fill="#94A3B8" font-family="Consolas, monospace" font-size="13">─</text>
    <text x="670" y="41" fill="#64748B" font-family="Consolas, monospace" font-size="13">□</text>
    <text x="692" y="41" fill="#475569" font-family="Consolas, monospace" font-size="13">×</text>
  </g>

  <!-- Рамка консоли -->
  <g font-family="Consolas, 'Cascadia Mono', monospace" font-size="12.5">
    <text x="40" y="76" fill="#64748B">╔══════════════════════════════════════════════════════════════════════════╗</text>
    <text x="40" y="96" fill="#64748B">║</text>
    <text x="208" y="96" fill="#38BDF8" font-weight="700">GhostClip Shield v0.3.0 (Консоль + Трей)</text>
    <text x="688" y="96" fill="#64748B">║</text>
    <text x="40" y="114" fill="#64748B">╠══════════════════════════════════════════════════════════════════════════╣</text>

    <text x="40" y="134" fill="#E2E8F0">║  [1] Чистка ссылок (utm, fbclid, si)                              </text>
    <text x="630" y="134" fill="#22C55E" font-weight="700">[ВКЛ]</text>
    <text x="688" y="134" fill="#64748B">║</text>

    <text x="40" y="153" fill="#E2E8F0">║  [2] Удаление невидимых символов                                  </text>
    <text x="630" y="153" fill="#22C55E" font-weight="700">[ВКЛ]</text>
    <text x="688" y="153" fill="#64748B">║</text>

    <text x="40" y="172" fill="#E2E8F0">║  [3] Детекция секретов и карт                                     </text>
    <text x="630" y="172" fill="#22C55E" font-weight="700">[ВКЛ]</text>
    <text x="688" y="172" fill="#64748B">║</text>

    <text x="40" y="191" fill="#E2E8F0">║  [4] Таймер самоуничтожения (45с)                                 </text>
    <text x="630" y="191" fill="#22C55E" font-weight="700">[ВКЛ]</text>
    <text x="688" y="191" fill="#64748B">║</text>

    <text x="40" y="210" fill="#E2E8F0">║  [5] Зачистка истории Win+V                                       </text>
    <text x="630" y="210" fill="#22C55E" font-weight="700">[ВКЛ]</text>
    <text x="688" y="210" fill="#64748B">║</text>

    <text x="40" y="229" fill="#E2E8F0">║  [6] Журнал clipboard_access.log                                  </text>
    <text x="630" y="229" fill="#22C55E" font-weight="700">[ВКЛ]</text>
    <text x="688" y="229" fill="#64748B">║</text>

    <text x="40" y="247" fill="#64748B">╠══════════════════════════════════════════════════════════════════════════╣</text>
    <text x="40" y="266" fill="#E2E8F0">║  Таймер: </text>
    <text x="122" y="266" fill="#F59E0B" font-weight="700">АКТИВЕН (42с)</text>
    <text x="255" y="266" fill="#94A3B8">| Белый список: 1 прил. (keepassxc.exe)</text>
    <text x="688" y="266" fill="#64748B">║</text>

    <text x="40" y="285" fill="#E2E8F0">║  Глобальная паника: </text>
    <text x="208" y="285" fill="#38BDF8">Ctrl+Shift+X: активен</text>
    <text x="688" y="285" fill="#64748B">║</text>

    <text x="40" y="304" fill="#94A3B8">║  [1-6] Вкл/Выкл | [S] Настройки | [B] Очистить | [P] ПАНИКА (Win+V)     ║</text>
    <text x="40" y="323" fill="#94A3B8">║  [T] Скрыть в трей (или [_])    | [C] Лог      | [Q] Выход              ║</text>
    <text x="40" y="341" fill="#64748B">╚══════════════════════════════════════════════════════════════════════════╝</text>

    <!-- Живой лог -->
    <text x="40" y="365" fill="#94A3B8" font-weight="700">--- ЖИВОЙ ЛОГ СОБЫТИЙ БУФЕРА ---</text>
    <text x="40" y="385" fill="#38BDF8">[21:14:03] [ОЧИСТКА] (msedge.exe) -&gt; Очищен URL (si, utm_source)</text>
    <text x="40" y="403" fill="#A78BFA">[21:14:11] [ОЧИСТКА] (WINWORD.EXE) -&gt; Удалено 5 скрытых знаков</text>
    <text x="40" y="421" fill="#F59E0B">[21:14:19] [СЕКРЕТ!] (Code.exe) OPENAI_KEY: sk-p•••UV (таймер 45с)</text>
    <text x="40" y="435" fill="#22C55E">[21:15:04] [ТАЙМЕР ИСТЁК] Секрет удалён из буфера и истории Win+V!</text>
  </g>

  <!-- Карточка системного трея Windows справа снизу -->
  <g filter="url(#cardShadow)">
    <rect x="520" y="342" width="318" height="114" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <!-- Эмблема щита с призраком -->
    <g transform="translate(540, 362)">
      <path d="M22 2 L40 9 V23 C40 34 31 42 22 46 C13 42 4 34 4 23 V9 Z" fill="#0F172A" stroke="url(#shieldGrad)" stroke-width="2.5"/>
      <path d="M15 24 C15 17 29 17 29 24 V33 L26 30 L22 33 L18 30 L15 33 Z" fill="#F8FAFC"/>
      <circle cx="19.5" cy="23.5" r="1.7" fill="#0F172A"/>
      <circle cx="24.5" cy="23.5" r="1.7" fill="#0F172A"/>
    </g>
    <text x="598" y="378" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="13.5" font-weight="700">
      Системный трей Windows
    </text>
    <text x="598" y="399" fill="#FBBF24" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="600">
      GhostClip: Секрет! Удаление через 42с
    </text>
    <text x="598" y="420" fill="#94A3B8" font-family="'Segoe UI', sans-serif" font-size="11.5">
      ПКМ — меню  |  Ctrl+Shift+X — паника
    </text>
    <rect x="598" y="430" width="218" height="6" rx="3" fill="#0F172A"/>
    <rect x="598" y="430" width="190" height="6" rx="3" fill="#F59E0B"/>
  </g>
</svg>
