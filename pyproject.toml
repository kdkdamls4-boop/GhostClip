[project]
name = "ghostclip-shield"
version = "0.3.0"
description = "Локальный защитник буфера обмена для Windows 10/11 без внешних зависимостей"
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 110
exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"explained/main.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
